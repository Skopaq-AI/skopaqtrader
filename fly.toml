app = 'skopaq-trader'
primary_region = 'bom'  # Mumbai — closest to NSE

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  # Kite login links (Telegram). Never set SKOPAQ_API_BASE_URL here: the API would
  # fetch its own token from itself.
  SKOPAQ_PUBLIC_BASE_URL = 'https://skopaq-trader.fly.dev'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "skopaq_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
