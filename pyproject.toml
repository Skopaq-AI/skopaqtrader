[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skopaqtrader"
version = "0.1.0"
description = "AI algorithmic trading platform for Indian equities — built on TradingAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Upstream TradingAgents deps (v0.5.1) ---
    "langchain-core>=0.3.81",
    # Skopaq: 1.7.4 knows claude-opus-5 (128K output; older versions cap unknown
    # models at 4096 tokens, which adaptive thinking can use up).
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.4.1",
    # --- Skopaq additions ---
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "typesafe-sdk>=0.7.1",
    "httpx>=0.28.0",
    "websockets>=13.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=44.0.0",
    "apscheduler>=3.10.0",
    "supabase>=2.11.0",
    "upstash-redis>=1.1.0",
    "langcache>=0.11.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.2,<2",  # skopaq/mcp_server.py; 2.x drops mcp.server.FastMCP
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[project.scripts]
tradingagents = "cli.main:app"
skopaq = "skopaq.cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "skopaq*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
